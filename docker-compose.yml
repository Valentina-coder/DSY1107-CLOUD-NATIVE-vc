services:
  rabbitmq1:
    image: rabbitmq:4-management
    hostname: rabbitmq1
    container_name: stock360-rabbitmq1
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq1
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-stock360-local-erlang-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-stock360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-stock360-local}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - stock360-rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  rabbitmq2:
    image: rabbitmq:4-management
    hostname: rabbitmq2
    container_name: stock360-rabbitmq2
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq2
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-stock360-local-erlang-cookie}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-stock360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-stock360-local}
    ports:
      - "${RABBITMQ2_MANAGEMENT_PORT:-15673}:15672"
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - stock360-rabbitmq
    depends_on:
      rabbitmq1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./Backend
    container_name: stock360-backend
    environment:
      RABBITMQ_HOST: rabbitmq1
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-stock360}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-stock360-local}
      SPRING_DATASOURCE_URL: jdbc:h2:file:/app/data/inventariodb;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_DRIVER: org.h2.Driver
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://stock360-5953a.web.app}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_data:/app/data
    networks:
      - stock360-rabbitmq
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy

volumes:
  rabbitmq1_data:
  rabbitmq2_data:
  backend_data:

networks:
  stock360-rabbitmq:
    driver: bridge
