services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: stock360-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-stock360}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-stock360-local}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
