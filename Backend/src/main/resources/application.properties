# Servidor
server.port=8080

# H2 local; en cloud se reemplaza con SPRING_DATASOURCE_* (por ejemplo RDS).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:inventariodb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/60b6d162-a31e-41c7-94d1-c42651cc5a31/v2.0

# Generación automática de tablas
spring.jpa.hibernate.ddl-auto=update

# Configuración IDaaS Azure Entra ID. Se sobrescribe con variables de entorno en EC2.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AZURE_ISSUER_URI:https://login.microsoftonline.com/${AZURE_TENANT_ID:common}/v2.0}
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_API_AUDIENCE:api://STOCK360_BACKEND}

# API Gateway y desarrollo local
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/60b6d162-a31e-41c7-94d1-c42651cc5a31/v2.0
azure.activedirectory.client-id=7505e446-c5fa-4bce-ad90-271d80380996