# Servidor
server.port=8080

# Base de datos H2 persistente en archivo local
spring.datasource.url=jdbc:h2:file:./data/inventariodb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Generación automática de tablas
spring.jpa.hibernate.ddl-auto=update

# Firebase Authentication resource server.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${FIREBASE_ISSUER_URI:https://securetoken.google.com/stock360-5953a}
spring.security.oauth2.resourceserver.jwt.audience=${FIREBASE_PROJECT_ID:stock360-5953a}

# Logging (opcional, útil para debug)
logging.level.org.springframework.security.oauth2=DEBUG